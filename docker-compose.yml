version: '3.8'

services:
  # 1. Relational Database: MySQL 8.0
  mysql:
    image: mysql:8.0
    container_name: retailflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: retailflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  # 2. REST API Backend: Node.js Express + mysql2
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: rootpassword
      MYSQL_DATABASE: retailflow_db
      JWT_SECRET: b1c06b140e1770e98e5d5ca03b3538cc50a9a73e9efc43558cc2ad6dfa315b1640e15da679e6282631f32b8c4ed7e81ebe4bfb74aa74d23b4b53fae1cc949279
      CLIENT_ORIGIN: "*"
    depends_on:
      mysql:
        condition: service_healthy

  # 3. Web Client Frontend: React 18 SPA + Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retailflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
    driver: local
